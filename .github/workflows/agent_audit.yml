name: Agent Auditor (qualité technique des designs)

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche à auditer (vide = toutes)"
        required: false
        default: ""
  push:
    paths:
      - .triggers/audit

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet Pillow

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Auditor
        env:
          SOURCE_NICHE: ${{ inputs.niche }}
        run: python scripts/agent_auditor.py

      - name: Commit audits
        if: always()
        run: |
          git add 'products/**/audit*.json' 2>/dev/null || echo "(rien à ajouter)"
          if git diff --cached --quiet; then
            echo "Aucun audit à commit."
          else
            git commit -m "Audit qualité : update scores designs"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
