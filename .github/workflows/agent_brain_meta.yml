name: Agent Brain Meta (4 cerveaux perpétuels)

on:
  workflow_dispatch:
    inputs:
      brain_agent:
        description: "Brain à lancer (trends/tools/optimization/niches/vide=tous)"
        required: false
        default: ""
  schedule:
    # trends   : toutes les 4h
    - cron: "0 */4 * * *"
    # tools, optimization, niches : enchaînés via BRAIN_AGENT
  push:
    paths:
      - .triggers/brain_meta

concurrency:
  group: brain-meta-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  think:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        agent: [trends, tools, optimization, niches]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAIN_AGENT: ${{ inputs.brain_agent || matrix.agent }}
        run: python scripts/agent_brain_meta.py
      - if: always()
        run: |
          mkdir -p data/brain
          git add data/brain/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à commit"
          else
            git commit -m "Brain ${{ matrix.agent }} : proposals updated"
            for i in 1 2 3 4 5; do
              git push origin HEAD:${{ github.ref_name }} && break
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
