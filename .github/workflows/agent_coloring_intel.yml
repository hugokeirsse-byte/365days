name: Agent Coloring Intel (analyse bestsellers Amazon)

on:
  workflow_dispatch:
    inputs:
      niches_limit:
        description: "Nb niches à analyser (vide=12)"
        required: false
        default: "12"
      results_per_niche:
        description: "Nb covers par niche"
        required: false
        default: "8"
  # schedule:  # DÉSACTIVÉ
  #   # Tous les jeudis 3h UTC — rafraîchissement hebdo des styles dominants
  #   - cron: "0 3 * * 4"
  push:
    paths:
      - .triggers/coloring_intel

concurrency:
  group: coloring-intel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NICHES_LIMIT: ${{ inputs.niches_limit || '12' }}
          RESULTS_PER_NICHE: ${{ inputs.results_per_niche || '8' }}
        run: python scripts/agent_coloring_intel.py
      - if: always()
        run: |
          mkdir -p data
          git add data/coloring_styles_meta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à commit"
          else
            git commit -m "Coloring intel : styles dominants $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git push origin HEAD:${{ github.ref_name }} && break
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
