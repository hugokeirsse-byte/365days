name: Éclaireur Bestsellers (market intelligence)

on:
  push:
    paths: ['.triggers/eclaireur_bestsellers']
  workflow_dispatch:
  # schedule:  # DÉSACTIVÉ
  #   # Chaque mardi à 03h UTC — analyse marché en début de semaine
  #   - cron: '0 3 * * 2'

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

jobs:
  eclaireur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Créer dossiers nécessaires
        run: mkdir -p data/reports data/logs

      - name: Run Éclaireur Bestsellers
        run: |
          if [ -f scripts/agent_eclaireur_bestsellers.py ]; then
            python scripts/agent_eclaireur_bestsellers.py
          else
            echo "[ÉCLAIREUR] Script introuvable — skip"
            exit 0
          fi

      - name: Commit rapport éclaireur
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/ data/logs/ || true
          git diff --cached --quiet || git commit -m "Éclaireur Bestsellers : rapport $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then break; fi
            git pull --rebase origin ${{ github.ref_name }} || true
            sleep 2
          done
