name: Agent Gemini Quality Check (QC visuel IA)

# Cet agent ne s'active que si secrets.GEMINI_API_KEY est défini.
# Sans clé, il logue "skip" et n'altère rien.

on:
  workflow_dispatch:
    inputs:
      max_images:
        description: "Max images par run (économie quota gratuit 1500/j)"
        required: false
        default: "30"
      auto_reject:
        description: "Auto-reject (1=oui)"
        required: false
        default: "0"
  # schedule:
    # Tous les jours à minuit UTC — après les productions et visual_audit
    # - cron: "0 0 * * *"
  push:
    paths:
      - .triggers/gemini_quality_check

concurrency:
  group: gemini-quality-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run Gemini Quality Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_IMAGES:     ${{ inputs.max_images || '30' }}
          AUTO_REJECT:    ${{ inputs.auto_reject || '0' }}
        run: python scripts/agent_gemini_quality_check.py
      - name: Commit audit
        if: always()
        run: |
          mkdir -p data
          git add data/gemini_quality_report.json products/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun changement Gemini audit."
          else
            git commit -m "Gemini Quality Check : validation visuelle IA"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
