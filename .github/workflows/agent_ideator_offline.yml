name: Agent Ideator Offline (brainstorm combinatoire)

on:
  workflow_dispatch: {}
  schedule:
    # Mercredi 6h UTC — après les agents Reddit et seasonal
    - cron: "0 6 * * 3"
  push:
    paths:
      - .triggers/ideator

concurrency:
  group: ideator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  brainstorm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python scripts/agent_ideator_offline.py
      - name: Commit
        if: always()
        run: |
          mkdir -p data
          git add data/ideas_brainstorm.json 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucune nouvelle idée."
          else
            git commit -m "Ideator : brainstorm 200 idées scorées"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
