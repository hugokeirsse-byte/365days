name: Agent Niche Gap (Voie B — scan niches sous-exploitées)

on:
  workflow_dispatch: {}
  schedule:
    # Tous les jours à 4h UTC — niches sous-exploitées bougent moins vite
    - cron: "0 4 * * *"
  push:
    paths:
      - .triggers/niche_gap

concurrency:
  group: niche-gap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Niche Gap scanner
        run: python scripts/agent_niche_gap.py

      - name: Commit results
        if: always()
        run: |
          mkdir -p data
          git add data/niche_gap.json 2>/dev/null || echo "(rien à ajouter)"
          if git diff --cached --quiet; then
            echo "Aucun changement de niche gap."
          else
            git commit -m "Niche Gap update ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
