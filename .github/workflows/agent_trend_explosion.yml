name: Agent Trend Explosion (Voie A — scan ce qui explose)

on:
  workflow_dispatch: {}
  schedule:
    # Toutes les 6 heures — données fraîches sur les explosions du moment
    - cron: "0 */6 * * *"
  push:
    paths:
      - .triggers/trend_explosion

concurrency:
  group: trend-explosion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Trend Explosion scanner
        run: python scripts/agent_trend_explosion.py

      - name: Commit results
        if: always()
        run: |
          mkdir -p data
          git add data/trend_explosion.json 2>/dev/null || echo "(rien à ajouter)"
          if git diff --cached --quiet; then
            echo "Aucun changement d'explosion."
          else
            git commit -m "Trend Explosion update ($(date -u +%Y-%m-%d-%H))"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
