name: Architecte Système
on:
  push:
    paths: ['.triggers/architecte_systeme']
  workflow_dispatch:
  # schedule:  # DÉSACTIVÉ
  #   - cron: '0 4 * * 0'
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Créer dossiers
        run: mkdir -p data/reports data/logs data/build_queue
      - name: Run Architecte
        run: |
          if [ -f scripts/agent_architecte_systeme.py ]; then
            python scripts/agent_architecte_systeme.py
          else
            echo "[ARCHITECTE] Script pas encore généré — en attente Builder"
            exit 0
          fi
      - name: Commit rapport + briefings auto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/ data/logs/ data/build_queue/ || true
          git diff --cached --quiet || git commit -m "Architecte Système : audit $(date +%Y-%m-%d)"
          git push || true
