name: B1 Stratège
on:
  push:
    paths: ['.triggers/b1_stratege']
  workflow_dispatch:
  # schedule:
  # - cron: '0 6 * * 1'
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  STRATEGE_MAX_PROPOSITIONS: '5'
  STRATEGE_TYPES_ACTIFS: 'roman,lowcontent,stl,coloriage,assets_svg'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Créer dossiers
        run: mkdir -p data/strategie/propositions data/logs
      - name: Run Stratège
        run: |
          if [ -f scripts/agent_b1_stratege.py ]; then
            python scripts/agent_b1_stratege.py
          elif [ -f scripts/agent_strategist.py ]; then
            python scripts/agent_strategist.py
          else
            echo "[STRATEGE] Script pas encore généré — en attente Builder"
            exit 0
          fi
      - name: Commit rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strategie/ data/logs/ || true
          git diff --cached --quiet || git commit -m "B1 Stratège : propositions $(date +%Y-%m-%d)"
          git push || true
