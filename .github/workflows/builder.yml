name: Builder (briefing.md -> code via Gemini)

on:
  workflow_dispatch:
    inputs:
      briefing:
        description: "Chemin du briefing (vide = traiter tous les pending)"
        required: false
        default: ""
  push:
    paths:
      - .triggers/builder

concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Traiter tous les briefings en file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          BRIEFING: ${{ inputs.briefing }}
        run: |
          if [ -n "$BRIEFING" ]; then
            echo "=== Traitement du briefing : $BRIEFING ==="
            python scripts/agent_builder.py || echo "Echec briefing $BRIEFING (continue)"
          else
            COUNT=0
            FAILED=0
            while [ $COUNT -lt 10 ]; do
              PENDING=$(ls data/build_queue/*.md 2>/dev/null | head -1)
              if [ -z "$PENDING" ]; then
                echo "Queue vide — tous les briefings traites."
                break
              fi
              echo "=== Briefing : $PENDING ==="
              if BRIEFING="$PENDING" python scripts/agent_builder.py; then
                echo "OK: $PENDING"
              else
                CODE=$?
                echo "ECHEC briefing $PENDING (code $CODE) — on continue avec le suivant"
                FAILED=$((FAILED + 1))
                # Eviter boucle infinie si le briefing ne se deplace pas vers done/
                BAIL_DIR=$(dirname "$PENDING")/done
                mkdir -p "$BAIL_DIR"
                mv "$PENDING" "$BAIL_DIR/" 2>/dev/null || true
              fi
              COUNT=$((COUNT + 1))
            done
            echo "Total traites: $COUNT ($FAILED echecs)"
          fi

      - name: Commit les fichiers generés
        if: always()
        run: |
          git add scripts/ data/build_queue/done/ 2>/dev/null || echo "(rien a ajouter)"
          if git diff --cached --quiet; then
            echo "Aucun fichier genere."
          else
            git commit -m "Builder: code genere par Gemini depuis briefings"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep $((i * 2))
            done
          fi
