name: CdC Low-Content Generator
on:
  push:
    paths: ['.triggers/cdc_lowcontent']
  workflow_dispatch:
    inputs:
      lc_id: {required: false, default: ''}
      lc_type: {required: false, default: 'journal'}
      lc_theme: {required: false, default: 'mindfulness'}
      lc_audience: {required: false, default: 'women'}
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Résoudre params
        id: p
        run: |
          T=$(grep -oP '^lc_type=\K.*' .triggers/cdc_lowcontent 2>/dev/null | head -1)
          TH=$(grep -oP '^lc_theme=\K.*' .triggers/cdc_lowcontent 2>/dev/null | head -1)
          A=$(grep -oP '^lc_audience=\K.*' .triggers/cdc_lowcontent 2>/dev/null | head -1)
          ID=$(grep -oP '^lc_id=\K.*' .triggers/cdc_lowcontent 2>/dev/null | head -1)
          T=${T:-journal}; TH=${TH:-mindfulness}; A=${A:-women}
          ID=${ID:-lc_$(date +%Y-%m-%d)_${T}_${TH}}
          echo "lc_id=$ID" >> $GITHUB_OUTPUT
          echo "lc_type=$T" >> $GITHUB_OUTPUT
          echo "lc_theme=$TH" >> $GITHUB_OUTPUT
          echo "lc_audience=$A" >> $GITHUB_OUTPUT
      - name: Run CdC Low-Content
        env:
          LC_ID: ${{ steps.p.outputs.lc_id }}
          LC_TYPE: ${{ steps.p.outputs.lc_type }}
          LC_THEME: ${{ steps.p.outputs.lc_theme }}
          LC_AUDIENCE: ${{ steps.p.outputs.lc_audience }}
        run: |
          if [ -f scripts/agent_cdc_lowcontent.py ]; then
            python scripts/agent_cdc_lowcontent.py
          else
            echo "[CdC LC] Script non encore généré par Builder"
            exit 0
          fi
      - name: Commit CdC
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/lowcontent_kdp/ || true
          git diff --cached --quiet || git commit -m "CdC Low-Content généré — ${{ steps.p.outputs.lc_id }} — EN ATTENTE VALIDATION"
          git push || true
