name: CdC Queue Manager — 10 CdC par vertical en permanence

# Maintient TARGET_PENDING CdC avec gate=pending par vertical.
# CRON DÉSACTIVÉ — pivot vers Conformité AI Act. Lancement manuel uniquement.

on:
  # schedule:  # DÉSACTIVÉ
  #   - cron: '0 2,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      vertical:
        description: 'Vertical à remplir'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - coloring
          - stl
          - lowcontent
          - roman
          - merch_design
          - svg_packs
          - vintage_pd
      target:
        description: 'Nombre de CdC cibles par vertical (défaut: 10)'
        required: false
        default: '10'
      max_per_run:
        description: 'Max générés par run par vertical (défaut: 3)'
        required: false
        default: '3'
      dry_run:
        description: 'Afficher sans générer'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: cdc-queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fill-queue:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: pip install requests

      - name: Créer répertoires produits
        run: |
          mkdir -p products/coloring_books products/stl_3d products/lowcontent_kdp products/novels
          mkdir -p products/merch products/svg_packs products/vintage_pd
          mkdir -p data/brain/coloring data/brain/stl data/brain/lowcontent data/brain/roman
          mkdir -p data/brain/merch data/brain/svg data/brain/vintage_pd
          mkdir -p data/reports

      - name: Vérifier l'état des files (avant)
        run: python scripts/agent_cdc_queue_manager.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTICAL: ${{ github.event.inputs.vertical || 'all' }}
          TARGET: ${{ github.event.inputs.target || '10' }}
          MAX_PER_RUN: '0'
          DRY_RUN: '1'

      - name: Remplir les files manquantes
        run: |
          mkdir -p data/logs
          set -o pipefail
          python scripts/agent_cdc_queue_manager.py 2>&1 | tee data/logs/queue_run_latest.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTICAL: ${{ github.event.inputs.vertical || 'all' }}
          TARGET: ${{ github.event.inputs.target || '10' }}
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}

      - name: Commit nouveaux CdC
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "CdC Queue Manager"
          git config user.email "cdc-queue@365days.bot"
          git add products/ data/logs/queue_run_latest.txt
          git diff --staged --quiet && echo "Rien à committer" || {
            COUNT=$(git diff --staged --name-only | grep cdc.json | wc -l)
            git commit -m "queue: +${COUNT} CdC générés (gate=pending) — $(date +%Y-%m-%d %H:%M)"
            for i in 1 2 3 4; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep $((i * 2))
            done
          }
