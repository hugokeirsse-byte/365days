name: Coloring Book — Production depuis CdC approuvé

# Déclenché quand Hugo approuve un CdC coloring (gate_cdc → approved)
# Génère les pages via Pollinations + assemble le PDF KDP-ready

on:
  push:
    paths:
      - 'products/coloring_books/**/cdc.json'
  workflow_dispatch:
    inputs:
      coloring_dir:
        description: 'Dossier coloring spécifique (ex: products/coloring_books/coloring_2026-05-27_botanical). Vide = auto-détecte dernier approuvé.'
        required: false
        default: ''

jobs:
  check-gate:
    runs-on: ubuntu-latest
    outputs:
      has_approved: ${{ steps.gate.outputs.has_approved }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier si un CdC est approuvé
        id: gate
        run: |
          APPROVED=$(find products/coloring_books -name cdc.json 2>/dev/null | xargs python3 -c "
          import json, sys
          files = sys.argv[1:]
          for f in files:
              try:
                  d = json.load(open(f))
                  if d.get('gate_cdc') == 'approved' and not d.get('production_status'):
                      print(f)
                      break
              except: pass
          " 2>/dev/null || echo "")
          if [ -n "$APPROVED" ]; then
            echo "has_approved=true" >> $GITHUB_OUTPUT
            echo "CdC approuvé: $APPROVED"
          else
            echo "has_approved=false" >> $GITHUB_OUTPUT
            echo "Aucun CdC coloring approuvé en attente."
          fi

  produce:
    needs: check-gate
    if: needs.check-gate.outputs.has_approved == 'true' || github.event.inputs.coloring_dir != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: pip install Pillow reportlab requests

      - name: Créer répertoires
        run: mkdir -p products/coloring_books data/logs

      - name: Générer le livre de coloriage
        run: python scripts/produce_coloring_from_cdc.py
        env:
          COLORING_DIR: ${{ github.event.inputs.coloring_dir }}
        timeout-minutes: 60

      - name: Commit livre produit
        run: |
          git config user.name "Coloring Book Bot"
          git config user.email "coloring@365days.bot"
          git add products/coloring_books/
          git diff --staged --quiet && echo "Aucun fichier nouveau" || {
            SLUG=$(git diff --staged --name-only | grep "\.pdf$" | head -1 | cut -d'/' -f3)
            PAGES=$(git diff --staged --name-only | grep "page_.*\.png$" | wc -l)
            git commit -m "coloring: ${SLUG} — ${PAGES} pages + PDF KDP"
            git push
            echo ""
            echo "════════════════════════════════════════════════════"
            echo "  LIVRE DE COLORIAGE PRÊT — KDP UPLOAD"
            echo "════════════════════════════════════════════════════"
            echo "  → PDF: products/coloring_books/${SLUG}/${SLUG}.pdf"
            echo "  → Format: 8.5×11 inches, prêt KDP"
            echo "  → Uploader sur https://kdp.amazon.com"
          }
