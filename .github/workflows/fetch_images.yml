name: Fetch Wikimedia images

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/fetch_images.yml
      - scripts/fetch_images.py
      - Data.py
      - .triggers/fetch

concurrency:
  group: fetch-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run fetcher (commits intermédiaires tous les 30)
        run: python scripts/fetch_images.py

      - name: Commit images restantes
        if: always()
        run: |
          git add images/
          git add fetch_failures.log 2>/dev/null || echo "(fetch_failures.log absent, ignoré)"
          if git diff --cached --quiet; then
            echo "Aucune image restante à committer (déjà commit en cours de route)."
          else
            count=$(git diff --cached --name-only -- images/ | wc -l)
            git commit -m "Ajoute $count dernières illustrations Wikimedia"
            git push origin HEAD:${{ github.ref_name }}
          fi
