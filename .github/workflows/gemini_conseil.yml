name: Gemini Conseiller
on:
  push:
    paths: ['.triggers/gemini_conseil']
  workflow_dispatch:
    inputs:
      sujet: {required: false, default: ''}
      contexte: {required: false, default: ''}
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run Conseil
        env:
          CONSEIL_SUJET: ${{ inputs.sujet }}
          CONSEIL_CONTEXTE: ${{ inputs.contexte }}
        run: |
          if [ -f scripts/agent_gemini_conseiller.py ]; then
            python scripts/agent_gemini_conseiller.py
          else
            echo "[CONSEIL] Script pas encore généré"; exit 0
          fi
      - name: Commit conseil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/conseils/ || true
          git diff --cached --quiet || git commit -m "Gemini Conseil : $(date +%Y-%m-%d)"
          git push || true
