name: Gemini Dialogue A↔B — Collaboration Adversariale

# Lance un dialogue entre Gemini A (questionneurateur) et Gemini B (créateur)
# pour produire un livrable optimisé par itérations successives.
# Le prompt cerveau génère les rôles. L'auditrice valide le résultat final.
# Auto-commit sur GitHub si le score dépasse MIN_AUDIT_SCORE.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Sujet du dialogue (ex: système réponses appels offres BOAMP)'
        required: true
        default: ''
      goal:
        description: 'Objectif précis / livrable attendu'
        required: true
        default: ''
      max_turns:
        description: 'Nombre max de tours A↔B (défaut: 8)'
        required: false
        default: '8'
      tempo:
        description: 'Secondes entre appels API (défaut: 5, min: 3 pour rate limit)'
        required: false
        default: '5'
      min_audit_score:
        description: 'Score min pour auto-commit (défaut: 70)'
        required: false
        default: '70'
      auto_commit:
        description: 'Auto-commit sur GitHub si validé'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: gemini-dialogue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dialogue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Créer répertoires
        run: mkdir -p data/dialogues data/prompts data/audit_logs

      - name: Lancer le dialogue Gemini A↔B
        run: python scripts/gemini_dialogue.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
          GOAL: ${{ github.event.inputs.goal }}
          MAX_TURNS: ${{ github.event.inputs.max_turns || '8' }}
          TEMPO: ${{ github.event.inputs.tempo || '5' }}
          MIN_AUDIT_SCORE: ${{ github.event.inputs.min_audit_score || '70' }}
          AUTO_COMMIT: ${{ github.event.inputs.auto_commit == 'true' && '1' || '0' }}

      - name: Commit résultats (si auto_commit désactivé)
        if: ${{ github.event.inputs.auto_commit != 'true' }}
        run: |
          git config user.name "Gemini Dialogue Bot"
          git config user.email "dialogue@365days.bot"
          git add data/dialogues/ data/audit_logs/
          git diff --staged --quiet && echo "Rien à committer" || {
            git commit -m "dialogue: ${{ github.event.inputs.topic }} — $(date +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git push origin HEAD:${{ github.ref_name }} && break
              sleep $((i * 2))
            done
          }
