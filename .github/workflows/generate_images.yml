name: Generate AI images

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modèle Pollinations (flux, flux-realism, turbo…)"
        required: false
        default: "flux"
      width:
        description: "Largeur en pixels (2048 = qualité max, 1024 = rapide)"
        required: false
        default: "2048"
      height:
        description: "Hauteur en pixels (2048 = qualité max, 1024 = rapide)"
        required: false
        default: "2048"
  push:
    paths:
      - .triggers/generate

concurrency:
  group: generate-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run generator
        env:
          POLLINATIONS_MODEL:  ${{ inputs.model  || 'flux' }}
          POLLINATIONS_WIDTH:  ${{ inputs.width  || '2048' }}
          POLLINATIONS_HEIGHT: ${{ inputs.height || '2048' }}
          POLLINATIONS_TOKEN:  ${{ secrets.POLLINATIONS_TOKEN }}
        run: python scripts/generate_images.py

      - name: Commit images restantes
        if: always()
        run: |
          echo "=== Contenu de generated_images/ ==="
          ls -la generated_images/ 2>&1 || echo "(dossier introuvable)"
          echo ""
          echo "=== git status (avant add) ==="
          git status --short || true
          echo ""
          echo "=== git add generated_images/ ==="
          mkdir -p generated_images
          git add generated_images/ 2>/dev/null || echo "(rien à ajouter)"
          git add generation_failures.log 2>/dev/null || echo "(generation_failures.log absent, ignoré)"
          echo ""
          echo "=== git status (après add) ==="
          git status --short || true
          echo ""
          if git diff --cached --quiet; then
            echo "Rien à commit (cache git vide)."
          else
            count=$(git diff --cached --name-only -- generated_images/ | wc -l)
            echo "=== Commit de $count fichiers ==="
            git commit -m "Ajoute $count dernières images IA"
            echo ""
            echo "=== git push (avec rebase si rejeté) ==="
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then
                break
              fi
              echo "push rejeté, rebase + retry $i/5"
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
