name: 2. Generate TPT Products

on:
  push:
    branches: [main]
    paths:
      - "scripts/tpt/generators/*.py"
      - "scripts/tpt/themes/*.svg"
      - "scripts/tpt/themes/*.png"
      - "scripts/brand.py"
  workflow_dispatch:
    inputs:
      generators:
        description: "Générateurs à lancer (vide=tous) ex: mystery_picture,task_cards"
        required: false
        default: ""
      themes:
        description: "Thèmes (vide=tous) ex: halloween,christmas"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet reportlab svglib pillow google-generativeai

      - name: Setup Nunito font
        run: |
          mkdir -p scripts/tpt/fonts
          if [ ! -f scripts/tpt/fonts/Nunito-Regular.ttf ]; then
            curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
              -o scripts/tpt/fonts/Nunito-Regular.ttf
            cp scripts/tpt/fonts/Nunito-Regular.ttf scripts/tpt/fonts/Nunito-Bold.ttf
            cp scripts/tpt/fonts/Nunito-Regular.ttf scripts/tpt/fonts/Nunito-SemiBold.ttf
            cp scripts/tpt/fonts/Nunito-Regular.ttf scripts/tpt/fonts/Nunito-ExtraBold.ttf
          fi

      - name: Run all generators
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GENERATORS: ${{ github.event.inputs.generators }}
          THEMES: ${{ github.event.inputs.themes }}
          OUT_DIR: products/tpt
        run: python scripts/tpt/run_all.py

      - name: Commit & push products
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products/
          git diff --staged --quiet && echo "Rien de nouveau." || (
            git commit -m "Auto-generate TPT products [$(date +%Y-%m-%d)]"
            git push
          )
