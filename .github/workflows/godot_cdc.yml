name: Godot Assets — Génération CdC manuelle

# Génère un CdC pour un pack d'assets Godot/Itch.io

on:
  workflow_dispatch:
    inputs:
      type_asset:
        description: 'Type d'asset'
        required: true
        type: choice
        options:
          - sprite_pack
          - ui_kit
          - tileset
          - game_template
          - shader_pack
          - addon
        default: sprite_pack
      theme:
        description: 'Thème (ex: "fantasy medieval", "cyberpunk neon", "cozy farm")'
        required: true
        default: 'fantasy medieval'
      nb_assets:
        description: 'Nombre d'assets dans le pack'
        required: false
        default: '30'

jobs:
  generate-cdc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: mkdir -p products/godot_assets data/logs

      - name: Générer le CdC Godot
        run: python scripts/agent_godot_cdc.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GODOT_TYPE: ${{ github.event.inputs.type_asset }}
          GODOT_THEME: ${{ github.event.inputs.theme }}
          GODOT_NB_ASSETS: ${{ github.event.inputs.nb_assets }}

      - name: Commit CdC
        run: |
          git config user.name "Godot CdC Bot"
          git config user.email "godot@365days.bot"
          git add products/godot_assets/
          git diff --staged --quiet && echo "Rien à committer" || {
            git commit -m "godot: CdC ${{ github.event.inputs.type_asset }} '${{ github.event.inputs.theme }}' — gate=pending"
            git push
            echo ""
            echo "═══════════════════════════════════════════"
            echo "  CdC Godot généré — À VALIDER"
            echo "═══════════════════════════════════════════"
            echo "  Type: ${{ github.event.inputs.type_asset }}"
            echo "  Thème: ${{ github.event.inputs.theme }}"
            echo "  → Lire CAHIER_DES_CHARGES.md dans products/godot_assets/"
            echo "  → gate_cdc = approved → push → production"
          }
