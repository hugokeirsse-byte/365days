name: Gold Mines — Détecteur de Business Émergents

# Radar hebdomadaire sur les NOUVEAUX types de business exploitables
# avec Claude + GitHub + Gemini + outils gratuits. PAS des niches produit —
# des business MODÈLES entiers qui émergent ou mutent.

on:
  # schedule:
  # - cron: '0 5 * * 4'   # Jeudi 05h UTC (après jeux_societe_brain 04h)
  workflow_dispatch:
    inputs:
      angle_override:
        description: 'Angle manuel (ex: ai_tools_monetization)'
        required: false
        default: ''

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: pip install requests

      - name: Créer répertoires
        run: mkdir -p data/brain data/reports

      - name: Lancer Gold Mines
        run: python scripts/agent_gold_mines.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOLD_ANGLE: ${{ github.event.inputs.angle_override }}

      - name: Commit rapport
        run: |
          git config user.name "Gold Mines Brain"
          git config user.email "gold-mines@365days.bot"
          git add data/brain/gold_mines*.json data/reports/rapport_gold_mines*.md
          git diff --staged --quiet || git commit -m "gold_mines: opportunités émergentes $(date +%Y-%m-%d)"
          git push
