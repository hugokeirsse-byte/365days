name: Jeux de Société Brain — Tendances tabletop
on:
  # schedule:  # DÉSACTIVÉ
  #   - cron: '0 4 * * 4'   # Jeudi 04h UTC
  workflow_dispatch:
    inputs:
      angle: {description: 'Angle override', required: false, default: ''}
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: mkdir -p data/brain/jeux_societe data/reports
      - run: python scripts/agent_jeux_societe_trends.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JEU_ANGLE: ${{ github.event.inputs.angle }}
      - run: |
          git config user.name "Jeux Brain" && git config user.email "jeux@365days.bot"
          git add data/ && git diff --staged --quiet || git commit -m "brain: jeux societe trends $(date +%Y-%m-%d)" && git push
