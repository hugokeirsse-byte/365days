name: Jeux de Société — CdC Generator

on:
  workflow_dispatch:
    inputs:
      type_jeu:
        description: 'Type de jeu'
        required: true
        default: 'card_game'
        type: choice
        options:
          - card_game
          - board_game
          - dice_game
          - party_game
          - educational
          - rpg_accessory
      theme:
        description: 'Thème (ex: "infirmières dark humor", "fantasy medieval", "cyberpunk dystopia")'
        required: true
        default: 'dark humor office'
      mecanique:
        description: 'Mécanique principale (ex: "questions réponses", "bluffing", "coopératif")'
        required: false
        default: 'questions reponses'
      langue:
        description: 'Langue du jeu'
        required: false
        default: 'fr'
        type: choice
        options:
          - fr
          - en

jobs:
  generate-cdc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: pip install requests

      - name: Créer répertoire jeux
        run: mkdir -p products/jeux_societe

      - name: Générer CdC jeu de société
        run: python scripts/agent_jeux_societe_cdc.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JEU_TYPE: ${{ github.event.inputs.type_jeu }}
          JEU_THEME: ${{ github.event.inputs.theme }}
          JEU_MECANIQUE: ${{ github.event.inputs.mecanique }}
          JEU_LANGUE: ${{ github.event.inputs.langue }}

      - name: Commit CdC (gate=pending)
        run: |
          git config user.name "Jeux Bot"
          git config user.email "jeux@365days.bot"
          git add products/jeux_societe/
          git diff --staged --quiet || git commit -m "cdc: jeu ${{ github.event.inputs.type_jeu }} '${{ github.event.inputs.theme }}' — EN ATTENTE VALIDATION HUGO"
          git push

      - name: Instructions Hugo
        run: |
          echo ""
          echo "════════════════════════════════════════════════"
          echo "  CdC JEU généré — EN ATTENTE VALIDATION HUGO"
          echo "════════════════════════════════════════════════"
          echo ""
          echo "Hugo doit:"
          echo "  1. Lire products/jeux_societe/{slug}/CAHIER_DES_CHARGES.md"
          echo "     → Concept, règles, composants, exemples de cartes"
          echo "  2. Poser la question : 'Ce jeu est-il jouable et vendable ?'"
          echo "  3. Éditer cdc.json : gate_cdc = 'approved' ou 'rejected'"
          echo "  4. Push → production démarre automatiquement"
          echo ""
          echo "Points critiques à valider :"
          echo "  - Les règles sont-elles complètes et compréhensibles ?"
          echo "  - La niche est-elle suffisamment spécifique ?"
          echo "  - Le contenu des cartes est-il original et fun ?"
