name: Low-Content Brain — Tendances KDP
on:
  # schedule:
  # - cron: '0 5 * * 2'   # Mardi 05h UTC
  workflow_dispatch:
    inputs:
      angle: {description: 'Angle override', required: false, default: ''}
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: mkdir -p data/brain/lowcontent data/reports
      - run: python scripts/agent_lowcontent_trends.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LC_ANGLE: ${{ github.event.inputs.angle }}
      - run: |
          git config user.name "LC Brain" && git config user.email "lc@365days.bot"
          git add data/ && git diff --staged --quiet || git commit -m "brain: low-content trends $(date +%Y-%m-%d)" && git push
