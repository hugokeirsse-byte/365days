name: Low-Content KDP — Production depuis CdC approuvé

# Déclenché quand Hugo approuve un CdC low-content (gate_cdc → approved)
# Génère le PDF ReportLab complet (journaux, planners, trackers)

on:
  push:
    paths:
      - 'products/lowcontent_kdp/**/cdc.json'
  workflow_dispatch:
    inputs:
      lc_dir:
        description: 'Dossier low-content spécifique (ex: products/lowcontent_kdp/lc_2026-05-27_mindfulness_journal). Vide = auto-détecte dernier approuvé.'
        required: false
        default: ''

jobs:
  check-gate:
    runs-on: ubuntu-latest
    outputs:
      has_approved: ${{ steps.gate.outputs.has_approved }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier si un CdC est approuvé
        id: gate
        run: |
          APPROVED=$(find products/lowcontent_kdp -name cdc.json 2>/dev/null | xargs python3 -c "
          import json, sys
          files = sys.argv[1:]
          for f in files:
              try:
                  d = json.load(open(f))
                  if d.get('gate_cdc') == 'approved' and not d.get('production_status'):
                      print(f)
                      break
              except: pass
          " 2>/dev/null || echo "")
          if [ -n "$APPROVED" ]; then
            echo "has_approved=true" >> $GITHUB_OUTPUT
            echo "CdC approuvé: $APPROVED"
          else
            echo "has_approved=false" >> $GITHUB_OUTPUT
            echo "Aucun CdC low-content approuvé en attente."
          fi

  produce:
    needs: check-gate
    if: needs.check-gate.outputs.has_approved == 'true' || github.event.inputs.lc_dir != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu
          pip install reportlab

      - name: Créer répertoires
        run: mkdir -p products/lowcontent_kdp data/logs

      - name: Générer le livre low-content
        run: python scripts/produce_lowcontent_from_cdc.py
        env:
          LC_DIR: ${{ github.event.inputs.lc_dir }}
        timeout-minutes: 15

      - name: Commit livre produit
        run: |
          git config user.name "Low-Content Bot"
          git config user.email "lowcontent@365days.bot"
          git add products/lowcontent_kdp/
          git diff --staged --quiet && echo "Aucun fichier nouveau" || {
            SLUG=$(git diff --staged --name-only | grep "\.pdf$" | head -1 | cut -d'/' -f3)
            git commit -m "lowcontent: ${SLUG} — PDF KDP 6x9 généré"
            git push
            echo ""
            echo "════════════════════════════════════════════════════"
            echo "  JOURNAL/PLANNER PRÊT — KDP UPLOAD"
            echo "════════════════════════════════════════════════════"
            echo "  → Format 6×9 inches, prêt KDP"
            echo "  → Uploader sur https://kdp.amazon.com"
          }
