name: Merch Brain — Tendances POD/Design
on:
  # schedule:
  # - cron: '0 4 * * 5'   # Vendredi 04h UTC
  workflow_dispatch:
    inputs:
      angle: {description: 'Angle override', required: false, default: ''}
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: mkdir -p data/brain/merch data/reports
      - run: python scripts/agent_merch_trends.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MERCH_ANGLE: ${{ github.event.inputs.angle }}
      - run: |
          git config user.name "Merch Brain" && git config user.email "merch@365days.bot"
          git add data/ && git diff --staged --quiet || git commit -m "brain: merch trends $(date +%Y-%m-%d)" && git push
