name: Mobile Apps Brain — Tendances App Store / Google Play / ProductHunt
on:
  # schedule:  # DÉSACTIVÉ
  #   - cron: '0 5 * * 5'   # Vendredi 05h UTC
  workflow_dispatch:
    inputs:
      angle: {description: 'Angle override', required: false, default: ''}
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: mkdir -p data/reports data/logs
      - run: python scripts/agent_mobile_apps_trends.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOBILE_APPS_ANGLE: ${{ github.event.inputs.angle }}
      - run: |
          git config user.name "Mobile Apps Brain" && git config user.email "mobile-apps@365days.bot"
          git add data/reports/ && git diff --staged --quiet || git commit -m "brain: mobile_apps trends $(date +%Y-%m-%d)" && git push
