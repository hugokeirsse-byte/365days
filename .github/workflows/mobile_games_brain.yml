name: Mobile Games Brain — Tendances App Store / Google Play / Itch.io
on:
  # schedule:  # DÉSACTIVÉ
  #   - cron: '0 5 * * 1'   # Lundi 05h UTC
  workflow_dispatch:
    inputs:
      angle: {description: 'Angle override', required: false, default: ''}
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: mkdir -p data/reports data/logs
      - run: python scripts/agent_mobile_games_trends.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOBILE_GAMES_ANGLE: ${{ github.event.inputs.angle }}
      - run: |
          git config user.name "Mobile Games Brain" && git config user.email "mobile-games@365days.bot"
          git add data/reports/ && git diff --staged --quiet || git commit -m "brain: mobile_games trends $(date +%Y-%m-%d)" && git push
