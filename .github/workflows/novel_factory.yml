name: Novel Factory (plan + write + assemble)

on:
  workflow_dispatch:
    inputs:
      novel_id:
        description: "ID du roman (ex: romance_001_hidden_cove)"
        required: true
        default: "novel_test_001"
      step:
        description: "plan / write / all"
        required: false
        default: "plan"
      start_chapter:
        description: "Reprendre a partir du chapitre N (write uniquement)"
        required: false
        default: "1"
      max_chapters:
        description: "Ecrire max N chapitres par run (eviter timeout)"
        required: false
        default: "10"

concurrency:
  group: novel-${{ inputs.novel_id }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  novel:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "Etape PLAN : generer le plan roman"
        if: ${{ inputs.step == 'plan' || inputs.step == 'all' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NOVEL_ID: ${{ inputs.novel_id }}
        run: python scripts/agent_novel_planner.py

      - name: "Etape WRITE : ecrire les chapitres"
        if: ${{ inputs.step == 'write' || inputs.step == 'all' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NOVEL_ID: ${{ inputs.novel_id }}
          START_CHAPTER: ${{ inputs.start_chapter }}
          MAX_CHAPTERS: ${{ inputs.max_chapters }}
        run: python scripts/agent_novel_writer.py

      - name: Commit artefacts roman
        if: always()
        run: |
          git add products/novels/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun artefact nouveau."
          else
            git commit -m "Novel: ${{ inputs.novel_id }} [${{ inputs.step }}]"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep $((i * 2))
            done
          fi
