name: Produce Bible Verses (christian wall art)

on:
  workflow_dispatch:
    inputs:
      max_verses:
        description: "Max versets (vide=50)"
        required: false
        default: "10"
      max_styles:
        description: "Styles par verset (1-4)"
        required: false
        default: "2"
      testament:
        description: "Filtre (old, new, both)"
        required: false
        default: "both"
  push:
    paths:
      - .triggers/bible_verses

concurrency:
  group: bible-verses-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run Bible Verses producer
        env:
          MAX_VERSES:  ${{ inputs.max_verses || '10' }}
          MAX_STYLES:  ${{ inputs.max_styles || '2' }}
          TESTAMENT:   ${{ inputs.testament || 'both' }}
        run: python scripts/produce_bible_verses.py
      - name: Commit designs
        if: always()
        run: |
          mkdir -p products/bible_verses
          git add products/bible_verses/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun design à commit."
          else
            count=$(find products/bible_verses -name "metadata.json" 2>/dev/null | wc -l)
            git commit -m "Bible Verses : produit $count designs"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
