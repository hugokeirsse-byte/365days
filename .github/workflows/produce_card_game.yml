name: Produce Card Game (The Game Crafter)

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche (devops, pompiers, profs, peche, nurses, vide=toutes)"
        required: false
        default: ""
      max_cards:
        description: "Max cards questions par deck"
        required: false
        default: "20"
  push:
    paths:
      - .triggers/card_game

concurrency:
  group: card-game-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu
          pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run
        env:
          NICHE: ${{ inputs.niche }}
          MAX_CARDS: ${{ inputs.max_cards || '20' }}
        run: python scripts/produce_card_game.py
      - name: Commit
        if: always()
        run: |
          mkdir -p products/card_game
          git add products/card_game/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucune carte"
          else
            count=$(find products/card_game -name "card_*.png" 2>/dev/null | wc -l)
            git commit -m "Card Game : produit $count cartes"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
