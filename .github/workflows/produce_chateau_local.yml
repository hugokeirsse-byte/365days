name: Produce Chateau Local (B2B POD monument)

on:
  workflow_dispatch:
    inputs:
      chateau:
        description: "Chateau ID (filename in data/chateau_local/ sans .json)"
        required: true
        default: "example_chateau"
      produits:
        description: "Produits (csv ou 'all')"
        required: false
        default: "all"
  push:
    paths:
      - .triggers/chateau_local
      - data/chateau_local/*.json

concurrency:
  group: chateau-local-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu
          pip install --quiet Pillow reportlab
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - env:
          CHATEAU: ${{ inputs.chateau || 'example_chateau' }}
          PRODUITS: ${{ inputs.produits || 'all' }}
        run: python scripts/produce_chateau_local.py
      - if: always()
        run: |
          mkdir -p products/chateau_local
          git add products/chateau_local/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à commit"
          else
            git commit -m "Chateau Local : produits B2B générés"
            for i in 1 2 3 4 5; do
              git push origin HEAD:${{ github.ref_name }} && break
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
