name: Produce Mirabilia Chess Book (Vol I)

on:
  workflow_dispatch:
    inputs:
      demo_puzzles:
        description: "Nombre de puzzles (vide = 365 production complète, 30 = démo rapide)"
        required: false
        default: "30"
  push:
    paths:
      - .triggers/chess_book

concurrency:
  group: chess-book-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (cairo, zstd, fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            zstd \
            libcairo2 libcairo2-dev \
            fonts-cormorantgaramond fonts-crimson-pro fonts-ebgaramond \
            fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install --quiet python-chess cairosvg Pillow reportlab requests

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Produce chess book
        env:
          DEMO_PUZZLES:   ${{ inputs.demo_puzzles || '30' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/produce_chess_book.py

      - name: Commit livre produit
        if: always()
        run: |
          mkdir -p books/mirabilia/01_chess_puzzles/output
          git add 'books/mirabilia/01_chess_puzzles/output/' \
                  'books/mirabilia/01_chess_puzzles/puzzles_selection.json' \
                  'books/mirabilia/01_chess_puzzles/explanations.json' \
                  2>/dev/null || echo "(rien à ajouter)"
          if git diff --cached --quiet; then
            echo "Aucun fichier livre à commit."
          else
            git commit -m "Mirabilia Chess Book : produit (démo ou prod)"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
