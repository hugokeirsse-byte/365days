name: Produce Coloring Book (KDP ready)

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche (mystical_mushrooms, mystical_creatures, fairy_cottages)"
        required: true
        default: "mystical_mushrooms"
      pages:
        description: "Nombre de pages (max 30)"
        required: false
        default: "30"
      event_key:
        description: "Event overlay (halloween, christmas, mothers_day…) vide=aucun"
        required: false
        default: ""
  push:
    paths:
      - .triggers/coloring_book

concurrency:
  group: coloring-book-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet Pillow reportlab
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run Coloring Book producer
        env:
          NICHE:     ${{ inputs.niche || 'mystical_mushrooms' }}
          PAGES:     ${{ inputs.pages || '30' }}
          EVENT_KEY: ${{ inputs.event_key }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # workflow_dispatch : niche choisie. push .triggers/coloring_book :
          # le fichier trigger peut porter un quota optionnel :
          #   niche=mystical_creatures
          #   pages=6
          # Si absent -> batch des 3 niches (catalogue varié).
          if [ "${{ github.event_name }}" = "push" ]; then
            T_NICHE=$(grep -oP '^niche=\K.*' .triggers/coloring_book 2>/dev/null | head -1)
            T_PAGES=$(grep -oP '^pages=\K.*' .triggers/coloring_book 2>/dev/null | head -1)
            if [ -n "$T_NICHE" ]; then
              echo "→ Run cadré (trigger) : $T_NICHE / ${T_PAGES:-30} pages"
              NICHE="$T_NICHE" PAGES="${T_PAGES:-30}" python scripts/produce_coloring_book.py || true
            else
              for niche in mystical_mushrooms mystical_creatures fairy_cottages; do
                if [ ! -f "products/coloring_books/${niche}/${niche}.pdf" ]; then
                  echo "→ Production : $niche"
                  NICHE=$niche python scripts/produce_coloring_book.py || true
                else
                  echo "⊝ $niche déjà produit, skip"
                fi
              done
            fi
          else
            python scripts/produce_coloring_book.py
          fi
      - name: Commit book
        if: always()
        run: |
          mkdir -p products/coloring_books
          git add products/coloring_books/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun livre à commit."
          else
            git commit -m "Coloring Book : ${{ inputs.niche }} produit"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
