name: Produce COPE pack (Create Once, Distribute Everywhere)

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche à produire (vide = toutes)"
        required: false
        default: "witchy_cottagecore"
      max_designs:
        description: "Nombre max de designs par niche (vide = tous)"
        required: false
        default: "5"
  push:
    paths:
      - .triggers/cope_pack

concurrency:
  group: cope-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet Pillow

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run COPE pipeline
        env:
          SOURCE_NICHE: ${{ inputs.niche || 'witchy_cottagecore' }}
          MAX_DESIGNS:  ${{ inputs.max_designs || '5' }}
        run: python scripts/produce_cope_pack.py

      - name: Commit production
        if: always()
        run: |
          mkdir -p products
          git add products/ 2>/dev/null || echo "(rien à ajouter)"
          if git diff --cached --quiet; then
            echo "Aucun design à commit."
          else
            count=$(git diff --cached --name-only -- 'products/**/raw.png' 'products/**/metadata.json' 2>/dev/null | wc -l)
            git commit -m "COPE : produit designs niche ${{ inputs.niche || 'witchy_cottagecore' }}"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              echo "push rejeté, rebase + retry $i/5"
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
