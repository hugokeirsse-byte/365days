name: Produce GameDev Asset Pack (itch.io / Unity / Fab)

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "Pack (fantasy_swords/rpg_potions/dungeon_icons/scifi_tiles/monster_portraits/ui_kit_fantasy/vide=tous)"
        required: false
        default: ""
  push:
    paths:
      - .triggers/gamedev_asset_pack

concurrency:
  group: gamedev-asset-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu
          pip install --quiet Pillow
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - env:
          PACK: ${{ inputs.pack }}
        run: python scripts/produce_gamedev_asset_pack.py
      - if: always()
        run: |
          mkdir -p products/gamedev
          git add products/gamedev/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à commit"
          else
            count=$(find products/gamedev -name "sprite_*.png" 2>/dev/null | wc -l)
            git commit -m "GameDev asset packs : $count sprites"
            for i in 1 2 3 4 5; do
              git push origin HEAD:${{ github.ref_name }} && break
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
