name: Produce I Heart HF (SDXL via Hugging Face)

# S'active dès que secrets.HF_API_KEY est défini.

on:
  workflow_dispatch:
    inputs:
      max_niches:
        description: "Max niches (1-8)"
        required: false
        default: "5"
  push:
    paths:
      - .triggers/iheart_hf

concurrency:
  group: iheart-hf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu
          pip install --quiet Pillow
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          MAX_NICHES: ${{ inputs.max_niches || '5' }}
        run: python scripts/produce_iheart_hf.py
      - if: always()
        run: |
          mkdir -p products/iheart_hf
          git add products/iheart_hf/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "vide"; else
            count=$(find products/iheart_hf -name "metadata.json" 2>/dev/null | wc -l)
            git commit -m "I Heart HF : produit $count designs SDXL"
            for i in 1 2 3 4 5; do
              git push origin HEAD:${{ github.ref_name }} && break
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
