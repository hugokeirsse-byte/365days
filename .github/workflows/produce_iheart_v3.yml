name: Produce I Heart V3 (text overlay Pillow gibberish-proof)

on:
  workflow_dispatch:
    inputs:
      max_niches:
        description: "Max niches (vide=20)"
        required: false
        default: "5"
      max_styles:
        description: "Max styles par niche (1-3)"
        required: false
        default: "2"
  push:
    paths:
      - .triggers/iheart_v3

concurrency:
  group: iheart-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu
          pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run I Heart V3 producer
        env:
          MAX_NICHES: ${{ inputs.max_niches || '5' }}
          MAX_STYLES: ${{ inputs.max_styles || '2' }}
        run: python scripts/produce_iheart_v3.py
      - name: Commit designs
        if: always()
        run: |
          mkdir -p products/iheart_v3
          git add products/iheart_v3/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun design à commit."
          else
            count=$(find products/iheart_v3 -name "metadata.json" 2>/dev/null | wc -l)
            git commit -m "I Heart V3 (overlay) : produit $count designs"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
