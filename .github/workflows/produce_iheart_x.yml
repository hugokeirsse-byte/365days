name: Produce I Heart X (Etsy + Printful tshirt/poster)

on:
  workflow_dispatch:
    inputs:
      max_niches:
        description: "Max niches (vide=toutes ~24)"
        required: false
        default: "5"
      max_variants:
        description: "Max variants par niche (1-4)"
        required: false
        default: "2"
  push:
    paths:
      - .triggers/iheart

concurrency:
  group: iheart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run I Heart X producer
        env:
          MAX_NICHES:   ${{ inputs.max_niches || '5' }}
          MAX_VARIANTS: ${{ inputs.max_variants || '2' }}
        run: python scripts/produce_iheart_x.py
      - name: Commit designs
        if: always()
        run: |
          mkdir -p products/iheart
          git add products/iheart/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun design à commit."
          else
            count=$(find products/iheart -name "metadata.json" 2>/dev/null | wc -l)
            git commit -m "I Heart X : produit $count designs"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
