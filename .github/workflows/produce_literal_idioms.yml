name: Produce Literal Idioms (humour visuel polyglottes)

on:
  workflow_dispatch:
    inputs:
      max_idioms:
        description: "Max idiomes (vide=tous ~30)"
        required: false
        default: "5"
  push:
    paths:
      - .triggers/literal_idioms

concurrency:
  group: literal-idioms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run Literal Idioms producer
        env:
          MAX_IDIOMS: ${{ inputs.max_idioms || '5' }}
        run: python scripts/produce_literal_idioms.py
      - name: Commit designs
        if: always()
        run: |
          mkdir -p products/literal_idioms
          git add products/literal_idioms/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun design à commit."
          else
            count=$(find products/literal_idioms -name "metadata.json" 2>/dev/null | wc -l)
            git commit -m "Literal Idioms : produit $count designs"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
