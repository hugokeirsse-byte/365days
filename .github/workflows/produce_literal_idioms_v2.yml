name: Produce literal_idioms_v2

on:
  workflow_dispatch: {}
  push:
    paths:
      - .triggers/literal_idioms_v2

concurrency:
  group: literal_idioms_v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu
          pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python scripts/produce_literal_idioms_v2.py
      - name: Commit
        if: always()
        run: |
          mkdir -p products/literal_idioms_v2
          git add products/literal_idioms_v2/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun design"
          else
            count=$(find products/literal_idioms_v2 -name "metadata.json" 2>/dev/null | wc -l)
            git commit -m "literal_idioms_v2 : produit $count designs"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
