name: Produce Low-Content KDP

on:
  workflow_dispatch:
    inputs:
      book:
        description: "Book (fishing_log, bird_watching, crochet_tracker, pet_health, sourdough_log, dnd_campaign, garden_planner, climbing_log, vinyl_collection, brewing_log) — vide=tous"
        required: false
        default: ""
      pages:
        description: "Pages intérieures (défaut 100)"
        required: false
        default: "100"
  push:
    paths:
      - .triggers/lowcontent_kdp

concurrency:
  group: lowcontent-kdp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu
          pip install --quiet reportlab
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - env:
          BOOK: ${{ inputs.book }}
          PAGES: ${{ inputs.pages || '100' }}
        run: python scripts/produce_lowcontent_kdp.py
      - if: always()
        run: |
          mkdir -p products/lowcontent_kdp
          git add products/lowcontent_kdp/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "vide"; else
            count=$(find products/lowcontent_kdp -name "*.pdf" 2>/dev/null | wc -l)
            git commit -m "Low-content KDP : $count livres"
            for i in 1 2 3 4 5; do
              git push origin HEAD:${{ github.ref_name }} && break
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
