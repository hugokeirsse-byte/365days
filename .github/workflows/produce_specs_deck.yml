name: Produce SPECS deck

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition (filename in data/specs_decks sans .json)"
        required: true
        default: "roast_and_boast_us_base"
      max_cards:
        description: "Max cards (0=toutes)"
        required: false
        default: "0"
      render_full_box:
        description: "Inclure box cover + règles (1/0)"
        required: false
        default: "1"
  push:
    paths:
      - .triggers/specs_deck
      - data/specs_decks/*.json

concurrency:
  group: specs-deck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu
          pip install --quiet Pillow
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - env:
          EDITION: ${{ inputs.edition || 'roast_and_boast_us_base' }}
          MAX_CARDS: ${{ inputs.max_cards || '0' }}
          RENDER_FULL_BOX: ${{ inputs.render_full_box || '1' }}
        run: python scripts/produce_specs_deck.py
      - if: always()
        run: |
          mkdir -p products/specs
          git add products/specs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à commit"
          else
            count=$(find products/specs -name "*.png" 2>/dev/null | wc -l)
            git commit -m "SPECS : produit $count PNG"
            for i in 1 2 3 4 5; do
              git push origin HEAD:${{ github.ref_name }} && break
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
