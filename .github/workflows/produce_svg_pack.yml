name: Produce SVG packs (Cricut/Etsy)

on:
  workflow_dispatch: {}
  push:
    paths:
      - .triggers/svg_pack

concurrency:
  group: svg-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends potrace fonts-dejavu-core
          pip install --quiet Pillow

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run SVG pack producer
        run: python scripts/produce_svg_pack.py

      - name: Commit packs
        if: always()
        run: |
          mkdir -p products/svg_packs
          git add products/svg_packs/ 2>/dev/null || echo "(rien à ajouter)"
          if git diff --cached --quiet; then
            echo "Aucun pack à commit."
          else
            count=$(ls products/svg_packs/*.zip 2>/dev/null | wc -l)
            git commit -m "Produit $count packs SVG prêts pour Etsy"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              echo "push rejeté, rebase + retry $i/5"
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
