name: Produce Tumbler Wraps (Etsy sublimation)

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche cible (witchy_cottagecore, floral_boho, coffee_humor, vide=toutes)"
        required: false
        default: ""
      max_designs:
        description: "Max designs par niche (vide=tous)"
        required: false
        default: "5"
  push:
    paths:
      - .triggers/tumbler

concurrency:
  group: tumbler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run Tumbler Wraps producer
        env:
          SOURCE_NICHE: ${{ inputs.niche }}
          MAX_DESIGNS:  ${{ inputs.max_designs || '5' }}
        run: python scripts/produce_tumbler_wraps.py
      - name: Commit wraps
        if: always()
        run: |
          mkdir -p products/tumbler_wraps
          git add products/tumbler_wraps/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun wrap à commit."
          else
            count=$(ls products/tumbler_wraps/*/design_*/wrap.png 2>/dev/null | wc -l)
            git commit -m "Tumbler Wraps : produit $count designs"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
