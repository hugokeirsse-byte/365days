name: Produce Viral Formats V2 (overlay Pillow gibberish-proof)

on:
  workflow_dispatch:
    inputs:
      max_formats:
        description: "Max formats (vide=65)"
        required: false
        default: "5"
      max_niches:
        description: "Max niches (vide=25)"
        required: false
        default: "5"
      format_family:
        description: "Filtre family (medical, geek, vintage, house…)"
        required: false
        default: ""
  push:
    paths:
      - .triggers/viral_formats_v2

concurrency:
  group: viral-formats-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu
          pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run Viral Formats V2 producer
        env:
          MAX_FORMATS:   ${{ inputs.max_formats || '5' }}
          MAX_NICHES:    ${{ inputs.max_niches || '5' }}
          FORMAT_FAMILY: ${{ inputs.format_family }}
        run: python scripts/produce_viral_formats_v2.py
      - name: Commit designs
        if: always()
        run: |
          mkdir -p products/viral_formats_v2
          git add products/viral_formats_v2/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun design à commit."
          else
            count=$(find products/viral_formats_v2 -name "metadata.json" 2>/dev/null | wc -l)
            git commit -m "Viral Formats V2 (overlay) : produit $count designs"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
