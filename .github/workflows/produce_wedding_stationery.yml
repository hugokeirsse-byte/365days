name: Produce Wedding Stationery (trend Q2 2026 +4200%)

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Thème (wildflower_meadow, boho_desert, garden_romance, vintage_botanical, soft_stitch_embroidery)"
        required: true
        default: "wildflower_meadow"
      max_items:
        description: "Nombre d'items dans la suite (max 6)"
        required: false
        default: "6"
  push:
    paths:
      - .triggers/wedding_stationery

concurrency:
  group: wedding-stationery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu
          pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run Wedding Stationery producer
        env:
          THEME:     ${{ inputs.theme || 'wildflower_meadow' }}
          MAX_ITEMS: ${{ inputs.max_items || '6' }}
        run: |
          # En mode .triggers/, produit les 5 thèmes en batch.
          # En workflow_dispatch, produit le thème demandé.
          if [ "${{ github.event_name }}" = "push" ]; then
            for theme in wildflower_meadow boho_desert garden_romance vintage_botanical soft_stitch_embroidery; do
              echo "→ Production thème : $theme"
              THEME=$theme python scripts/produce_wedding_stationery.py || true
            done
          else
            python scripts/produce_wedding_stationery.py
          fi
      - name: Commit designs
        if: always()
        run: |
          mkdir -p products/wedding_stationery
          git add products/wedding_stationery/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun design à commit."
          else
            count=$(find products/wedding_stationery -name "metadata.json" 2>/dev/null | wc -l)
            git commit -m "Wedding Stationery : produit $count items"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
