name: Prospecteur d'Émergence
on:
  push:
    paths: ['.triggers/prospecteur_emergence']
  workflow_dispatch:
  # schedule:  # DÉSACTIVÉ
  #   - cron: '0 5 * * 4'
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Créer dossiers
        run: mkdir -p data/reports data/logs
      - name: Run Prospecteur
        run: |
          if [ -f scripts/agent_prospecteur_emergence.py ]; then
            python scripts/agent_prospecteur_emergence.py
          else
            echo "[PROSPECTEUR] Script pas encore généré par le Builder — en attente"
            exit 0
          fi
      - name: Commit rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/ data/logs/ || true
          git diff --cached --quiet || git commit -m "Prospecteur Émergence : rapport $(date +%Y-%m-%d)"
          git push || true
