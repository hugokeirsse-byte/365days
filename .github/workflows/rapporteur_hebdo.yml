name: Rapporteur Hebdomadaire (digest semaine)

on:
  push:
    paths: ['.triggers/rapporteur_hebdo']
  workflow_dispatch:
  schedule:
    # Chaque dimanche à 20h UTC — fin de semaine, Hugo lit le rapport
    - cron: '0 20 * * 0'

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Créer dossiers nécessaires
        run: mkdir -p data/reports data/logs

      - name: Run Rapporteur Hebdomadaire
        run: |
          if [ -f scripts/agent_rapporteur_hebdo.py ]; then
            python scripts/agent_rapporteur_hebdo.py
          else
            echo "[RAPPORTEUR] Script introuvable — skip"
            exit 0
          fi

      - name: Commit rapport hebdo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/ data/logs/ || true
          git diff --cached --quiet || git commit -m "Rapport hebdomadaire : semaine $(date +%Y-W%V) ($(date +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then break; fi
            git pull --rebase origin ${{ github.ref_name }} || true
            sleep 2
          done
