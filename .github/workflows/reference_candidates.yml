name: Reference Candidates (GATE 1)

on:
  workflow_dispatch:
    inputs:
      brief_id:
        description: "ID du brief (data/briefs/<id>.json)"
        required: true
        default: "brief_2026-05-22_coloring_kawaii_mushroom_hollow"
      provider:
        description: "Forcer un fournisseur (vide = auto runware->...->pollinations)"
        required: false
        default: ""
  push:
    paths:
      - .triggers/reference_candidates

concurrency:
  group: reference-candidates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Generate reference candidates
        env:
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          BRIEF_ID="${{ inputs.brief_id }}"
          PROVIDER="${{ inputs.provider }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            T_BRIEF=$(grep -oP '^brief_id=\K.*' .triggers/reference_candidates 2>/dev/null | head -1)
            T_PROV=$(grep -oP '^provider=\K.*' .triggers/reference_candidates 2>/dev/null | head -1)
            BRIEF_ID="${T_BRIEF:-brief_2026-05-22_coloring_kawaii_mushroom_hollow}"
            PROVIDER="${T_PROV}"
          fi
          echo "Brief=$BRIEF_ID Provider=${PROVIDER:-auto}"
          BRIEF_ID="$BRIEF_ID" REFERENCE_PROVIDER="$PROVIDER" python scripts/gen_reference_candidates.py
      - name: Commit candidates
        if: always()
        run: |
          git add products/coloring_books/_gate1/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucune candidate a commit."
          else
            git commit -m "GATE 1: references candidates generees"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
