name: Roman Brain — Tendances KDP Fiction
on:
  schedule:
    - cron: '0 5 * * 3'   # Mercredi 05h UTC
  workflow_dispatch:
    inputs:
      angle: {description: 'Angle override', required: false, default: ''}
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: mkdir -p data/brain/roman data/reports
      - run: python scripts/agent_roman_trends.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROMAN_ANGLE: ${{ github.event.inputs.angle }}
      - run: |
          git config user.name "Roman Brain" && git config user.email "roman@365days.bot"
          git add data/brain/roman/ && git diff --staged --quiet || git commit -m "brain: roman trends $(date +%Y-%m-%d)" && git push
