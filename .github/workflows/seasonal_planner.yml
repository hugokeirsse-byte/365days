name: Seasonal Planner (anticipation événements)

on:
  workflow_dispatch: {}
  schedule:
    # Tous les lundis 07h UTC (après b1_stratege 06h, avant vintage_pd 09h)
    - cron: "0 7 * * 1"
  push:
    paths:
      - .triggers/seasonal

concurrency:
  group: seasonal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run seasonal planner
        run: python scripts/lib/seasonal_calendar.py

      - name: Commit upcoming events
        if: always()
        run: |
          mkdir -p data
          git add data/upcoming_events.json 2>/dev/null || echo "(rien à ajouter)"
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Seasonal planner update ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
