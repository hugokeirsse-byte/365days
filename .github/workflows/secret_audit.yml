name: Vigile Secrets (truffleHog mensuel)

on:
  schedule:
    # Le 1er de chaque mois à 2h UTC (cf. SECURITE_ET_LEGAL.md §5.4)
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --only-verified

      - name: Notify on finding
        if: failure()
        run: |
          echo "::warning::truffleHog a détecté des secrets vérifiés."
          echo "Action requise : révoquer les clés exposées, regénérer, mettre à jour les Secrets GitHub."
