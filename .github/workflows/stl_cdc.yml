name: STL CdC Generator

on:
  workflow_dispatch:
    inputs:
      product_type:
        description: 'Type de produit'
        required: true
        default: 'bookmark'
        type: choice
        options:
          - bookmark
          - keychain
          - coaster
          - door_plate
          - plant_marker
      niche:
        description: 'Niche / thème'
        required: true
        default: 'cottagecore'
        type: choice
        options:
          - cottagecore
          - dnd
          - witchy
          - minimalist
          - booklover
          - botanical
          - gaming
          - pet_lover
          - coffee
          - seasonal
      nb_variantes:
        description: 'Nombre de variantes (textes différents)'
        required: false
        default: '15'

jobs:
  generate-cdc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: pip install requests

      - name: Générer CdC STL
        run: python scripts/agent_stl_cdc.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STL_TYPE: ${{ github.event.inputs.product_type }}
          STL_NICHE: ${{ github.event.inputs.niche }}
          STL_NB_VARIANTES: ${{ github.event.inputs.nb_variantes }}

      - name: Commit CdC (gate=pending)
        run: |
          git config user.name "STL CdC Bot"
          git config user.email "stl-cdc@365days.bot"
          git add products/stl_3d/
          git diff --staged --quiet || git commit -m "cdc: STL ${{ github.event.inputs.product_type }} ${{ github.event.inputs.niche }} — EN ATTENTE VALIDATION HUGO"
          git push

      - name: Afficher instructions Hugo
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  ⏳ CdC généré — EN ATTENTE VALIDATION"
          echo "════════════════════════════════════════"
          echo ""
          echo "Hugo doit:"
          echo "  1. Lire le CdC dans products/stl_3d/{slug}/CAHIER_DES_CHARGES.md"
          echo "  2. Éditer products/stl_3d/{slug}/cdc.json"
          echo "  3. Changer gate_cdc de 'pending' à 'approved' (ou 'rejected')"
          echo "  4. Pousser → la production démarrera automatiquement"
          echo ""
