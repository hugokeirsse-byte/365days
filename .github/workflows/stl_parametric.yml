name: STL Parametric (3D print ready)

on:
  workflow_dispatch:
    inputs:
      product:
        description: "bookmark / keychain / coaster / door_plate"
        required: false
        default: "bookmark"
      template:
        description: "cottagecore / dnd / witchy / minimalist / booklover / coffee"
        required: false
        default: "cottagecore"
      max_variants:
        description: "Max variants (defaut 15)"
        required: false
        default: "15"
  push:
    paths:
      - .triggers/stl_parametric

concurrency:
  group: stl-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dependances
        run: pip install --quiet numpy numpy-stl

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve params
        id: params
        run: |
          PRODUCT="${{ inputs.product }}"
          TEMPLATE="${{ inputs.template }}"
          MAX="${{ inputs.max_variants }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            P=$(grep -oP '^product=\K.*' .triggers/stl_parametric 2>/dev/null | head -1)
            T=$(grep -oP '^template=\K.*' .triggers/stl_parametric 2>/dev/null | head -1)
            M=$(grep -oP '^max_variants=\K.*' .triggers/stl_parametric 2>/dev/null | head -1)
            PRODUCT="${P:-bookmark}"
            TEMPLATE="${T:-cottagecore}"
            MAX="${M:-15}"
          fi
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "template=$TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "max_variants=$MAX" >> "$GITHUB_OUTPUT"
          echo "Product=$PRODUCT | Template=$TEMPLATE | Max=$MAX"

      - name: Generer les STL
        env:
          PRODUCT: ${{ steps.params.outputs.product }}
          TEMPLATE: ${{ steps.params.outputs.template }}
          MAX_VARIANTS: ${{ steps.params.outputs.max_variants }}
        run: python scripts/produce_stl_parametric.py

      - name: Commit artefacts STL
        if: always()
        run: |
          git add products/stl_parametric/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun STL genere."
          else
            git commit -m "STL: ${{ steps.params.outputs.product }} x ${{ steps.params.outputs.template }} ($(git diff --cached --name-only | grep -c '.stl') fichiers)"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep $((i * 2))
            done
          fi
