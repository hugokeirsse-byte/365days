name: STL Production + Render + Audit

on:
  push:
    paths:
      - 'products/stl_3d/**/cdc.json'
  workflow_dispatch:
    inputs:
      stl_dir:
        description: 'Chemin produit (ex: products/stl_3d/stl_2026-05-27_bookmark_cottagecore)'
        required: false
        default: ''
      force_all:
        description: 'Forcer tous les produits approved'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-gate:
    runs-on: ubuntu-latest
    outputs:
      should_produce: ${{ steps.gate.outputs.should_produce }}
      stl_dir: ${{ steps.gate.outputs.stl_dir }}

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le gate CdC
        id: gate
        run: |
          STL_DIR="${{ github.event.inputs.stl_dir }}"

          if [ -n "$STL_DIR" ]; then
            CDC="$STL_DIR/cdc.json"
            if [ -f "$CDC" ]; then
              GATE=$(python3 -c "import json; d=json.load(open('$CDC')); print(d.get('gate_cdc','pending'))")
              echo "Gate pour $STL_DIR: $GATE"
              if [ "$GATE" = "approved" ]; then
                echo "should_produce=true" >> $GITHUB_OUTPUT
                echo "stl_dir=$STL_DIR" >> $GITHUB_OUTPUT
              else
                echo "Gate = $GATE — production annulée"
                echo "should_produce=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "cdc.json introuvable dans $STL_DIR"
              echo "should_produce=false" >> $GITHUB_OUTPUT
            fi
          else
            # Chercher tous les produits approved
            APPROVED=$(find products/stl_3d -name cdc.json | xargs -I{} python3 -c "
          import json, sys
          try:
            d = json.load(open('{}'))
            if d.get('gate_cdc') == 'approved' and not d.get('production_status'):
              print(str('{}').replace('/cdc.json',''))
          except: pass
          " 2>/dev/null | head -1)

            if [ -n "$APPROVED" ]; then
              echo "Produit approved trouvé: $APPROVED"
              echo "should_produce=true" >> $GITHUB_OUTPUT
              echo "stl_dir=$APPROVED" >> $GITHUB_OUTPUT
            else
              echo "Aucun produit approved sans production en attente"
              echo "should_produce=false" >> $GITHUB_OUTPUT
            fi
          fi

  produce:
    needs: check-gate
    if: needs.check-gate.outputs.should_produce == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer OpenSCAD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openscad
          openscad --version

      - name: Installer Python deps
        run: pip install numpy matplotlib

      - name: Vérifier OpenSCAD disponible
        run: which openscad && openscad --version

      # ── ÉTAPE 1: Production STL ─────────────────────────────────────
      - name: Générer STL avec OpenSCAD
        run: python scripts/produce_stl_openscad.py
        env:
          STL_DIR: ${{ needs.check-gate.outputs.stl_dir }}
          OPENSCAD: openscad

      # ── ÉTAPE 2: Render PNG ─────────────────────────────────────────
      - name: Générer visuels PNG
        run: python scripts/render_stl_matplotlib.py
        env:
          STL_DIR: ${{ needs.check-gate.outputs.stl_dir }}

      # ── ÉTAPE 3: Audit qualité ──────────────────────────────────────
      - name: Audit qualité STL
        run: python scripts/agent_stl_audit.py || true
        env:
          STL_DIR: ${{ needs.check-gate.outputs.stl_dir }}

      # ── Commit tout ────────────────────────────────────────────────
      - name: Commit production
        run: |
          git config user.name "STL Production Bot"
          git config user.email "stl-prod@365days.bot"
          git add products/stl_3d/
          git diff --staged --quiet || git commit -m "stl: production $(basename ${{ needs.check-gate.outputs.stl_dir }}) — STL+renders+audit"
          git push

      - name: Afficher résultat audit
        run: |
          AUDIT_FILE="${{ needs.check-gate.outputs.stl_dir }}/AUDIT.txt"
          if [ -f "$AUDIT_FILE" ]; then
            echo ""
            echo "════════ AUDIT STL ════════"
            cat "$AUDIT_FILE"
            echo "═══════════════════════════"
          fi
