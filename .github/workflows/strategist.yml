name: Strategist (auto brief)

on:
  workflow_dispatch:
    inputs:
      product_type:
        description: "Type de produit cible"
        required: false
        default: "coloring_book"
  push:
    paths:
      - .triggers/strategist

concurrency:
  group: strategist-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  strategize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run Strategist (writes a brief via Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TARGET_PRODUCT_TYPE: ${{ inputs.product_type || 'coloring_book' }}
        run: |
          python scripts/agent_strategist.py
      - name: Commit new brief
        if: always()
        run: |
          git add data/briefs/ 2>/dev/null || echo "(rien)"
          if git diff --cached --quiet; then
            echo "Aucun nouveau brief (file pleine, doublon, ou Gemini indispo)."
          else
            git commit -m "Strategist: nouveau cahier des charges autonome (Gemini)"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
