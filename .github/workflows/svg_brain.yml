name: SVG Brain — Tendances Etsy/Cricut

on:
  schedule:
    - cron: '0 4 * * 0'   # Dimanche 04h UTC
  workflow_dispatch:
    inputs:
      angle:
        description: 'Angle override (etsy_bestsellers_svg|seasonal_trending_svg|cricut_niche_underserved|...)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: mkdir -p data/brain/svg data/reports
      - run: python scripts/agent_svg_trends.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SVG_ANGLE: ${{ github.event.inputs.angle }}
      - run: |
          git config user.name "SVG Brain" && git config user.email "svg@365days.bot"
          git add data/brain/svg/ data/reports/ && git diff --staged --quiet || git commit -m "brain: svg trends $(date +%Y-%m-%d)" && git push
