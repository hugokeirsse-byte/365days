name: SVG Packs — Production depuis CdC approuvé

# Déclenché quand Hugo approuve un CdC svg_packs
# Génère SVG procéduraux (svgwrite) ou vectorisés (Pollinations → Potrace)

on:
  push:
    paths:
      - 'products/svg_packs/**/cdc.json'
  workflow_dispatch:
    inputs:
      svg_dir:
        description: 'Dossier SVG spécifique (ex: products/svg_packs/svg_2026-05-28). Vide = auto-détecte dernier approuvé.'
        required: false
        default: ''

jobs:
  check-gate:
    runs-on: ubuntu-latest
    outputs:
      has_approved: ${{ steps.gate.outputs.has_approved }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier si un CdC est approuvé
        id: gate
        run: |
          APPROVED=$(find products/svg_packs -name cdc.json 2>/dev/null | xargs python3 -c "
          import json, sys
          files = sys.argv[1:]
          for f in files:
              try:
                  d = json.load(open(f))
                  if d.get('gate_cdc') == 'approved' and not d.get('production_status'):
                      print(f)
                      break
              except: pass
          " 2>/dev/null || echo "")
          if [ -n "$APPROVED" ]; then
            echo "has_approved=true" >> $GITHUB_OUTPUT
            echo "CdC approuvé: $APPROVED"
          else
            echo "has_approved=false" >> $GITHUB_OUTPUT
            echo "Aucun CdC SVG approuvé en attente."
          fi

  produce:
    needs: check-gate
    if: needs.check-gate.outputs.has_approved == 'true' || github.event.inputs.svg_dir != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends potrace
          pip install --quiet Pillow requests svgwrite

      - name: Configurer git
        run: |
          git config user.name "SVG Producer Bot"
          git config user.email "svg@365days.bot"

      - name: Produire le pack SVG
        run: python scripts/produce_svg_from_cdc.py
        env:
          SVG_DIR: ${{ github.event.inputs.svg_dir }}

      - name: Commit assets
        run: |
          git add products/svg_packs/
          if git diff --cached --quiet; then
            echo "Aucun fichier produit."
          else
            PACK=$(find products/svg_packs -name "*.zip" -newer products/svg_packs -maxdepth 2 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "pack")
            git commit -m "svg: pack produit — $PACK — gate=done"
            for i in 1 2 3 4; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              echo "retry push $i/4"
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep $((i * 2))
            done
          fi

      - name: Résumé production
        run: |
          echo "═══════════════════════════════════════════"
          echo "  PACK SVG PRODUIT"
          echo "═══════════════════════════════════════════"
          find products/svg_packs -name "*.zip" -newer products/svg_packs 2>/dev/null | while read f; do
            echo "  ZIP: $f"
          done
          echo "  → Télécharger le ZIP et uploader sur Etsy"
          echo "═══════════════════════════════════════════"
