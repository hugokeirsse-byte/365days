name: Test AI Horde (gratuit, img2img)

# Teste AI Horde (gratuit, GPU communautaires) : text2img + img2img.
# Declenche par workflow_dispatch OU ecriture de .triggers/test_aihorde.

on:
  workflow_dispatch:
  push:
    paths:
      - .triggers/test_aihorde

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run AI Horde test
        env:
          AIHORDE_API_KEY: ${{ secrets.AIHORDE_API_KEY }}
        run: python scripts/test_aihorde.py
      - name: Commit results
        if: always()
        run: |
          git add products/_generator_test/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "rien a commit"
          else
            git commit -m "Test AI Horde : text2img + img2img"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
