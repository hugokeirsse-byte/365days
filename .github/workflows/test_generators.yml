name: Test Generators (comparatif modèles HF)

# Génère le même prompt via plusieurs modèles HF + Pollinations pour identifier
# lequel répond et donne le meilleur line-art. Déclenché manuellement OU par
# l'écriture de .triggers/test_generators.

on:
  workflow_dispatch:
  push:
    paths:
      - .triggers/test_generators

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet Pillow
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run generator comparison
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: python scripts/test_generators.py
      - name: Commit results
        if: always()
        run: |
          git add products/_generator_test/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "rien a commit"
          else
            git commit -m "Test generators : comparatif modeles HF"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
