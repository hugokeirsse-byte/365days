name: Test HF Key

# Vérifie que le secret HF_API_KEY est présent (bon nom) ET valide (utilisable),
# sans jamais exposer la clé dans les logs (GitHub masque les secrets de toute façon).
# Lancement : onglet Actions -> "Test HF Key" -> "Run workflow".

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 1) Présence du secret (bon nom ?)
        env:
          HF_TOKEN: ${{ secrets.HF_API_KEY }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ HF_API_KEY absent ou vide dans les secrets du repo."
            echo "   -> Settings > Secrets and variables > Actions > New repository secret"
            echo "   -> Name EXACT : HF_API_KEY"
            exit 1
          fi
          echo "✅ HF_API_KEY présent (valeur masquée)."

      - name: 2) Validité / utilisabilité (appel réel HF whoami)
        env:
          HF_TOKEN: ${{ secrets.HF_API_KEY }}
        run: |
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/whoami-v2)
          echo "Réponse HTTP : $code"
          if [ "$code" = "200" ]; then
            echo "✅ Clé HF VALIDE et utilisable."
            jq -r '"Compte : \(.name // "?")  |  Type : \(.type // "?")"' /tmp/resp.json || true
          elif [ "$code" = "401" ]; then
            echo "❌ Clé HF INVALIDE (401) — token erroné ou révoqué. Régénère-le sur huggingface.co/settings/tokens."
            exit 1
          else
            echo "❌ Réponse inattendue (HTTP $code) — voir ci-dessous :"
            cat /tmp/resp.json || true
            exit 1
          fi
