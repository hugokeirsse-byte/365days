name: Test ImageRouter (multi-sources)

# Teste le routeur d'image resilient (together -> cloudflare -> segmind -> pollinations).
# Marche meme sans cle (Pollinations en filet). Declenche par dispatch ou .triggers/test_image_router.

on:
  workflow_dispatch:
  push:
    paths:
      - .triggers/test_image_router

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run ImageRouter test
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEGMIND_API_KEY: ${{ secrets.SEGMIND_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: python scripts/test_image_router.py
      - name: Commit results
        if: always()
        run: |
          git add products/_generator_test/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "rien a commit"
          else
            git commit -m "Test ImageRouter : resultat multi-sources"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then break; fi
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
