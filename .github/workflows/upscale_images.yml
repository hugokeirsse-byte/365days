name: Upscale images (Real-ESRGAN ×4)

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Dossier source à upscaler"
        required: false
        default: "generated_images"
      target_dir:
        description: "Dossier cible (créé si absent)"
        required: false
        default: "generated_images_hd"
      model:
        description: "Modèle (RealESRGAN_x4plus, RealESRGAN_x4plus_anime_6B, RealESRGAN_x2plus)"
        required: false
        default: "RealESRGAN_x4plus"
  push:
    paths:
      - .triggers/upscale

concurrency:
  group: upscale-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Real-ESRGAN (PyTorch CPU)
        run: |
          set -e
          pip install --quiet --upgrade pip
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet realesrgan basicsr opencv-python-headless numpy "pillow>=9.1.0"
          # Patch basicsr pour torchvision >=0.17 (rgb_to_grayscale a déménagé)
          python - <<'PY'
          import site, os
          for sp in site.getsitepackages():
              p = os.path.join(sp, "basicsr", "data", "degradations.py")
              if os.path.exists(p):
                  s = open(p).read()
                  s = s.replace(
                      "from torchvision.transforms.functional_tensor import rgb_to_grayscale",
                      "from torchvision.transforms.functional import rgb_to_grayscale",
                  )
                  open(p, "w").write(s)
                  print(f"Patched: {p}")
          PY
          python -c "import torch, realesrgan; print('OK', torch.__version__)"

      - name: Run upscaler
        env:
          SOURCE_DIR:    ${{ inputs.source_dir || 'generated_images' }}
          TARGET_DIR:    ${{ inputs.target_dir || 'generated_images_hd' }}
          UPSCALE_MODEL: ${{ inputs.model      || 'RealESRGAN_x4plus' }}
        run: python scripts/upscale_images.py

      - name: Commit images restantes
        if: always()
        env:
          TARGET_DIR: ${{ inputs.target_dir || 'generated_images_hd' }}
        run: |
          git add "$TARGET_DIR"/
          if git diff --cached --quiet; then
            echo "Aucune image upscalée restante à commit."
          else
            count=$(git diff --cached --name-only -- "$TARGET_DIR/" | wc -l)
            git commit -m "Upscale ×4 : $count dernières images HD"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:${{ github.ref_name }}; then
                break
              fi
              echo "push rejeté, rebase + retry $i/5"
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep 2
            done
          fi
