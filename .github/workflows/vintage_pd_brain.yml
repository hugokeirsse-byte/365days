name: Vintage Public Domain Brain

# Cerveau perpétuel pour le vertical vintage_pd.
# Recherche nouvelles collections, combinaisons gagnantes,
# opportunités educational coloring books, tendances esthétiques vintage.

on:
  schedule:
    - cron: '0 6 * * 1'   # Lundi 06h UTC
  workflow_dispatch:
    inputs:
      angle_override:
        description: 'Angle manuel (ex: botanical_medicinal_plants)'
        required: false
        default: ''

jobs:
  vpd-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: pip install requests

      - name: Créer répertoires brain VPD
        run: mkdir -p data/brain/vintage_pd data/reports

      - name: Lancer agent VPD Trends
        run: python scripts/agent_vintage_pd_trends.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VPD_ANGLE: ${{ github.event.inputs.angle_override }}

      - name: Commit rapport trends
        run: |
          git config user.name "Vintage PD Brain"
          git config user.email "vpd-brain@365days.bot"
          git add data/brain/vintage_pd/ data/reports/
          git diff --staged --quiet || git commit -m "brain: vintage_pd trends $(date +%Y-%m-%d)"
          git push
