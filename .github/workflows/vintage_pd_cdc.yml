name: Vintage PD — Génération CdC manuelle

# Génère un Cahier des Charges pour un produit dérivé d'une illustration
# du domaine public (Köhler, Audubon, Haeckel...). Un CdC = une source × un type produit.
# La file (cdc_queue_manager) en génère aussi automatiquement ; ce workflow
# permet à Hugo d'en forcer un précis à la demande.

on:
  workflow_dispatch:
    inputs:
      collection:
        description: "Collection source"
        required: true
        type: choice
        options:
          - kohler_medizinal
          - audubon_birds
          - haeckel_kunstformen
          - redoute_roses
          - besler_hortus
          - merian_insects
        default: kohler_medizinal
      sujet:
        description: "Sujet/spécimen (ex: lavandula_officinalis, great_blue_heron)"
        required: true
        default: 'lavandula_officinalis'
      product_type:
        description: "Type de produit cible"
        required: true
        type: choice
        options:
          - coloring_page
          - merch_tshirt
          - merch_mug
          - merch_tote
          - kdp_journal_cover
          - educational_coloring_book
        default: coloring_page

jobs:
  generate-cdc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: mkdir -p products/vintage_pd data/brain/vintage_pd data/logs

      - name: Générer le CdC Vintage PD
        run: python scripts/agent_vintage_pd_cdc.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VPD_COLLECTION: ${{ github.event.inputs.collection }}
          VPD_SUJET: ${{ github.event.inputs.sujet }}
          VPD_PRODUCT_TYPE: ${{ github.event.inputs.product_type }}

      - name: Commit CdC
        run: |
          git config user.name "Vintage PD CdC Bot"
          git config user.email "vintage-pd@365days.bot"
          git add products/vintage_pd/
          git diff --staged --quiet && echo "Rien à committer" || {
            git commit -m "vintage_pd: CdC ${{ github.event.inputs.collection }}/${{ github.event.inputs.sujet }} (${{ github.event.inputs.product_type }}) — gate=pending"
            git push
            echo ""
            echo "═══════════════════════════════════════════"
            echo "  CdC Vintage PD généré — À VALIDER"
            echo "═══════════════════════════════════════════"
            echo "  Collection : ${{ github.event.inputs.collection }}"
            echo "  Sujet      : ${{ github.event.inputs.sujet }}"
            echo "  Produit    : ${{ github.event.inputs.product_type }}"
            echo "  → Lire cdc.json dans products/vintage_pd/"
            echo "  → gate_cdc = approved → push → production"
          }
