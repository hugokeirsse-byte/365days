name: Vintage PD — Production depuis CdC approuvé

# Déclenché quand Hugo approuve un CdC vintage_pd (gate_cdc → approved).
# ZÉRO génération d'image payante : la source est domaine public (banque locale
# images/ ou Wikimedia), traitement Pillow uniquement.

on:
  push:
    paths:
      - 'products/vintage_pd/**/cdc.json'
  workflow_dispatch:
    inputs:
      vpd_dir:
        description: 'Dossier vintage_pd spécifique (ex: products/vintage_pd/vpd_2026-05-29_xxx). Vide = auto-détecte approuvé.'
        required: false
        default: ''

jobs:
  check-gate:
    runs-on: ubuntu-latest
    outputs:
      has_approved: ${{ steps.gate.outputs.has_approved }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier si un CdC est approuvé
        id: gate
        run: |
          APPROVED=$(find products/vintage_pd -name cdc.json 2>/dev/null | xargs python3 -c "
          import json, sys
          for f in sys.argv[1:]:
              try:
                  d = json.load(open(f))
                  if d.get('gate_cdc') == 'approved' and not d.get('production_status'):
                      print(f); break
              except: pass
          " 2>/dev/null || echo "")
          if [ -n "$APPROVED" ]; then
            echo "has_approved=true" >> $GITHUB_OUTPUT
            echo "CdC approuvé: $APPROVED"
          else
            echo "has_approved=false" >> $GITHUB_OUTPUT
            echo "Aucun CdC vintage_pd approuvé en attente."
          fi

  produce:
    needs: check-gate
    if: needs.check-gate.outputs.has_approved == 'true' || github.event.inputs.vpd_dir != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: pip install Pillow reportlab numpy

      - name: Créer répertoires
        run: mkdir -p products/vintage_pd data/logs

      - name: Produire le livrable depuis le CdC
        run: python scripts/produce_vintage_pd_from_cdc.py
        env:
          VPD_DIR: ${{ github.event.inputs.vpd_dir }}
        timeout-minutes: 30

      - name: Commit livrable produit
        run: |
          git config user.name "Vintage PD Production Bot"
          git config user.email "vintage-pd@365days.bot"
          # Ne pas committer les sources brutes Wikimedia temporaires
          rm -rf products/vintage_pd/*/_wiki
          git add products/vintage_pd/
          git diff --staged --quiet && echo "Aucun fichier nouveau" || {
            SLUG=$(git diff --staged --name-only | grep "output" | head -1 | cut -d'/' -f3)
            git commit -m "vintage_pd: ${SLUG} produit (domaine public, 0 IA payante)"
            for i in 1 2 3 4; do
              git push origin HEAD:${{ github.ref_name }} && break
              git pull --rebase origin ${{ github.ref_name }} || true
              sleep $((i * 2))
            done
            echo ""
            echo "════════════════════════════════════════════════════"
            echo "  LIVRABLE VINTAGE PD PRÊT"
            echo "════════════════════════════════════════════════════"
            echo "  → products/vintage_pd/${SLUG}/"
            echo "  → Uploader sur la plateforme cible (KDP/Etsy/Printify)"
          }
