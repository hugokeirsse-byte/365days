  <!-- Pumpkin body -->
  <ellipse cx="60" cy="82" rx="52" ry="46" fill="#E8771A"/>
  <!-- Left lobe -->
  <ellipse cx="24" cy="82" rx="30" ry="42" fill="#CC6600" opacity="0.55"/>
