<?xml version="1.0" encoding="UTF-8"?>
<!-- CC0 1.0 Public Domain — Christmas Tree Coloring Page -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <rect width="400" height="460" fill="white"/>

  <!-- Snow ground -->
  <ellipse cx="200" cy="445" rx="190" ry="22" fill="white" stroke="black" stroke-width="3"/>

  <!-- Tree trunk -->
  <rect x="178" y="368" width="44" height="58" rx="5"
        fill="white" stroke="black" stroke-width="4"/>

  <!-- Bottom tier -->
  <polygon points="200,238 78,370 322,370"
           fill="white" stroke="black" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Middle tier -->
  <polygon points="200,162 102,295 298,295"
           fill="white" stroke="black" stroke-width="4" stroke-linejoin="round"/>

  <!-- Top tier -->
  <polygon points="200,82 128,208 272,208"
           fill="white" stroke="black" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Star on top -->
  <polygon points="200,40 208,65 235,65 213,80 221,108 200,92 179,108 187,80 165,65 192,65"
           fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>

  <!-- Ornaments (circles) -->
  <circle cx="160" cy="290" r="13" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="238" cy="275" r="13" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="175" cy="345" r="13" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="248" cy="330" r="13" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="200" cy="315" r="13" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="155" cy="195" r="11" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="240" cy="185" r="11" fill="white" stroke="black" stroke-width="3"/>

  <!-- Garland / tinsel hints -->
  <path d="M128,208 Q165,218 200,212 Q235,206 272,208"
        fill="none" stroke="black" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M102,295 Q150,308 200,302 Q250,296 298,295"
        fill="none" stroke="black" stroke-width="2" stroke-dasharray="5,4"/>
</svg>
