<?xml version="1.0" encoding="UTF-8"?>
<!-- CC0 1.0 Public Domain — Snowman Coloring Page -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <rect width="400" height="460" fill="white"/>

  <!-- Snow ground -->
  <ellipse cx="200" cy="448" rx="195" ry="20" fill="white" stroke="black" stroke-width="3"/>

  <!-- Snowflakes in background -->
  <text x="55" y="75" font-size="28" fill="black" font-family="serif" text-anchor="middle">❄</text>
  <text x="345" y="68" font-size="22" fill="black" font-family="serif" text-anchor="middle">❄</text>
  <text x="48" y="200" font-size="18" fill="black" font-family="serif" text-anchor="middle">❄</text>
  <text x="352" y="210" font-size="18" fill="black" font-family="serif" text-anchor="middle">❄</text>
  <text x="75" y="370" font-size="16" fill="black" font-family="serif" text-anchor="middle">❄</text>
  <text x="328" y="355" font-size="16" fill="black" font-family="serif" text-anchor="middle">❄</text>

  <!-- Bottom snowball -->
  <circle cx="200" cy="355" r="90" fill="white" stroke="black" stroke-width="5"/>

  <!-- Middle snowball -->
  <circle cx="200" cy="242" r="68" fill="white" stroke="black" stroke-width="4.5"/>

  <!-- Head snowball -->
  <circle cx="200" cy="152" r="50" fill="white" stroke="black" stroke-width="4"/>

  <!-- Hat brim -->
  <rect x="148" y="102" width="104" height="14" rx="4"
        fill="white" stroke="black" stroke-width="3.5"/>
  <!-- Hat body -->
  <rect x="162" y="38" width="76" height="68" rx="5"
        fill="white" stroke="black" stroke-width="3.5"/>
  <!-- Hat band -->
  <rect x="162" y="90" width="76" height="14" rx="2"
        fill="white" stroke="black" stroke-width="2.5"/>

  <!-- Eyes -->
  <circle cx="185" cy="142" r="6" fill="black"/>
  <circle cx="215" cy="142" r="6" fill="black"/>

  <!-- Carrot nose -->
  <polygon points="200,152 188,158 218,158" fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  <!-- Nose lines detail -->
  <line x1="195" y1="154" x2="195" y2="157" stroke="black" stroke-width="1.5"/>
  <line x1="203" y1="154" x2="203" y2="157" stroke="black" stroke-width="1.5"/>

  <!-- Smile buttons (mouth) -->
  <circle cx="188" cy="170" r="4" fill="black"/>
  <circle cx="196" cy="175" r="4" fill="black"/>
  <circle cx="204" cy="175" r="4" fill="black"/>
  <circle cx="212" cy="170" r="4" fill="black"/>

  <!-- Scarf -->
  <path d="M150,195 Q200,182 250,195" fill="none" stroke="black" stroke-width="14" stroke-linecap="round"/>
  <path d="M150,195 Q200,208 250,195" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Scarf tails hanging -->
  <path d="M155,195 L148,225 L162,228 L158,210" fill="white" stroke="black" stroke-width="3" stroke-linejoin="round"/>

  <!-- Body buttons -->
  <circle cx="200" cy="282" r="7" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="200" cy="310" r="7" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="200" cy="338" r="7" fill="white" stroke="black" stroke-width="3"/>

  <!-- Arms (twigs) -->
  <!-- Left arm -->
  <path d="M132,248 L88,222" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <path d="M110,236 L92,215" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <path d="M110,236 L98,252" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <!-- Right arm -->
  <path d="M268,248 L312,222" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <path d="M290,236 L308,215" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <path d="M290,236 L302,252" stroke="black" stroke-width="3" stroke-linecap="round"/>
</svg>
